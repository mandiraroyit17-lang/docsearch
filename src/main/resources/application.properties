spring.application.name=docsearch

# In-memory H2 database, standing in for PostgreSQL/CockroachDB
spring.datasource.url=jdbc:h2:mem:docsearch;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional: inspect the in-memory DB at http://localhost:8080/h2-console
# JDBC URL to paste in: jdbc:h2:mem:docsearch
spring.h2.console.enabled=true

server.port=8080
